<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GA - Captura de movimento</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111214; color: #e8e8e8; font: 15px system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; }
  video { display: none; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
         background: rgba(17,18,20,.88); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; padding: 12px 16px; border-radius: 8px; border: 0; background: #2b2d31; color: #eee; }
  button.main { background: #e09a28; color: #111; font-weight: 600; }
  #info { flex: 1 1 200px; font-size: 13px; color: #aaa; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center;
           padding: 24px; text-align: center; background: #111214; }
  #start h1 { font-size: 22px; margin: 0; }
  #start p { margin: 0; max-width: 420px; color: #aaa; }
</style>
</head>
<body>
<div id="wrap"><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
<div id="bar">
  <button id="flip">Trocar câmera</button>
  <span id="info">Carregando…</span>
</div>
<div id="start">
  <h1>Captura de movimento do GA</h1>
  <p>Fique de corpo inteiro na frente da câmera, a uns 2 a 3 metros. O personagem do editor copia seus movimentos;
     a gravação é feita pelo botão Gravar no jogo.</p>
  <button class="main" id="go">Ativar câmera</button>
  <p id="err" style="color:#f77"></p>
</div>
<script type="module">
import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const src = new URLSearchParams(location.search).get('src') === 'pc' ? 'pc' : 'cel';
const video = document.getElementById('v'), canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const info = document.getElementById('info');
let facing = src === 'pc' ? 'user' : 'environment';
let landmarker = null, stream = null, sending = false, lastSend = 0, sent = 0, fpsT = performance.now();
const ori = { a: 0, b: 90, g: 0, has: 0 };

const LINES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[27,31],[24,26],[26,28],[28,32],[0,7],[0,8]];

async function camera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ audio: false,
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } } });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
}

async function start() {
  document.getElementById('err').textContent = '';
  try {
    // giroscópio: no iPhone precisa pedir permissão no clique
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission)
      await DeviceOrientationEvent.requestPermission().catch(() => {});
    addEventListener('deviceorientation', (e) => {
      if (e.alpha === null) return;
      ori.a = e.alpha; ori.b = e.beta; ori.g = e.gamma; ori.has = 1;
    });
    await camera();
    info.textContent = 'Carregando o detector de pose…';
    const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    landmarker = await PoseLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task',
                     delegate: 'GPU' },
      runningMode: 'VIDEO', numPoses: 1 });
    document.getElementById('start').style.display = 'none';
    requestAnimationFrame(loop);
  } catch (e) {
    document.getElementById('err').textContent = 'Não deu para abrir a câmera: ' + (e.message || e);
  }
}

function send(world, img) {
  const now = performance.now();
  if (sending || now - lastSend < 30) return; // ~30 quadros/s, sem acumular fila
  const L = img[23], R = img[24], S1 = img[11], S2 = img[12];
  const hx = (L.x + R.x) / 2, hy = (L.y + R.y) / 2;
  const hs = Math.hypot((S1.x + S2.x) / 2 - hx, (S1.y + S2.y) / 2 - hy); // tronco na imagem (profundidade)
  let s = `F ${now.toFixed(1)} ${src} ${ori.has} ${ori.a.toFixed(2)} ${ori.b.toFixed(2)} ${ori.g.toFixed(2)} ` +
          `${hx.toFixed(4)} ${hy.toFixed(4)} ${hs.toFixed(4)} ${facing === 'user' ? 1 : 0}`;
  for (const p of world) s += ` ${p.x.toFixed(4)} ${p.y.toFixed(4)} ${p.z.toFixed(4)} ${(p.visibility ?? 1).toFixed(2)}`;
  sending = true;
  lastSend = now;
  fetch('/f', { method: 'POST', body: s, headers: { 'Content-Type': 'text/plain' } })
    .then(() => { sent++; })
    .catch(() => { info.textContent = 'Sem conexão com o jogo (o editor de animação está aberto?)'; })
    .finally(() => { sending = false; });
}

// sem ninguém na imagem: manda só o giroscópio (o celular também serve de câmera da engine, como AR)
function sendOri() {
  const now = performance.now();
  if (!ori.has || sending || now - lastSend < 30) return;
  sending = true;
  lastSend = now;
  fetch('/f', { method: 'POST', body: `O ${now.toFixed(1)} ${src} ${ori.a.toFixed(2)} ${ori.b.toFixed(2)} ${ori.g.toFixed(2)}`,
                headers: { 'Content-Type': 'text/plain' } })
    .then(() => { sent++; }).catch(() => {}).finally(() => { sending = false; });
}

function loop() {
  if (video.readyState >= 2) {
    const r = landmarker.detectForVideo(video, performance.now());
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    if (r.landmarks && r.landmarks.length) {
      const img = r.landmarks[0];
      ctx.lineWidth = Math.max(3, canvas.width / 300);
      ctx.strokeStyle = '#f0a030';
      for (const [a, b] of LINES) {
        ctx.beginPath();
        ctx.moveTo(img[a].x * canvas.width, img[a].y * canvas.height);
        ctx.lineTo(img[b].x * canvas.width, img[b].y * canvas.height);
        ctx.stroke();
      }
      send(r.worldLandmarks[0], img);
    } else sendOri();
    const t = performance.now();
    if (t - fpsT > 1000) {
      info.textContent = `${src === 'pc' ? 'Câmera do PC' : 'Celular'} · enviando ${sent} quadros/s` +
                         (ori.has ? ` · giroscópio ${ori.a.toFixed(0)}° ${ori.b.toFixed(0)}° ${ori.g.toFixed(0)}°` : '');
      sent = 0;
      fpsT = t;
    }
  }
  requestAnimationFrame(loop);
}

document.getElementById('go').onclick = start;
document.getElementById('flip').onclick = async () => { facing = facing === 'user' ? 'environment' : 'user'; await camera(); };
</script>
</body>
</html>
